name: Build KotykBihun APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          unzip -q KotykBihun_Android_Phone_Ready.zip -d project

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          cd project/KotykBihun_Android_Phone
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KotykBihun-APK
          path: project/KotykBihun_Android_Phone/app/build/outputs/apk/debug/app-debug.apk
