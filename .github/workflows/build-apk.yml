name: Build KotykBihun APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -o KotykBihun_Android_Phone_Ready.zip -d android_project

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: android_project/KotykBihun_Android_Phone
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KotykBihun-APK
          path: android_project/KotykBihun_Android_Phone/app/build/outputs/apk/debug/app-debug.apk
